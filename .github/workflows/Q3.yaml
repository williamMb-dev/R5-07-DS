name: Q3 - Archive Java

on:
  push:
    paths:
      - 'Q3.java'
      - '.github/workflows/Q3.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Creer archive
        run: |
          echo "NOM PRENOM" > Q3_archive_java.txt
          cat Q3.java >> Q3_archive_java.txt

      - name: Envoyer archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Q3_archive_java.txt
          git diff --cached --quiet || (git commit -m "Archive Q3" && git push)
