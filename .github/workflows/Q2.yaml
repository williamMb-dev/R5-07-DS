name: Q2 - Archive complete XYZ

on:
  push:
    paths:
      - 'XYZ.txt'
      - '.github/workflows/Q2.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Creer archive
        run: |
          echo "NOM PRENOM" > Q2_archive_XYZ.txt
          date >> Q2_archive_XYZ.txt
          cat XYZ.txt >> Q2_archive_XYZ.txt
          wc -c XYZ.txt >> Q2_archive_XYZ.txt

      - name: Envoyer archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Q2_archive_XYZ.txt
          git diff --cached --quiet || (git commit -m "Archive Q2" && git push)
